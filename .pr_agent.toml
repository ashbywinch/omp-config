[openai]
custom_llm_provider = "openai"
api_base = "https://opencode.ai/zen/go/v1"

[config]
model = "openai/deepseek-v4-flash"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
repo_context_from_default_branch = false
repo_context_files = [
    "docs/PRD.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
]

[pr_reviewer]
require_tests_review = true
require_security_review = true
num_max_findings = 50
extra_instructions = "Check the PR against each file in repo_context_files. Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: requirement deviations from docs/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), documentation-standard deviations from docs/writing-documentation.md (docs failing the documentation-quality checklist — context efficiency, density, no-duplication, one topic per file — including that every doc is discoverable from AGENTS.md), and folder-structure deviations from docs/documentation-structure.md (missing or malformed required docs, or a doc that AGENTS.md cannot lead to). The canonical code-repo standards (coding, testing, UX) live in standards/ and are scaffolded into code repos — they do not govern omp-config's own docs, but a PR that edits one must keep it consistent with the rest of the canonical set. A change to a skill or standard must keep the repo self-check (make test) green and mention that the change needs make install + omp restart to take effect."

[github_action_config]
handle_push_trigger = true
# Don't skip push synchronize events from bot senders: omp-harness's
# commits get the same review as human ones.
push_trigger_ignore_bot_commits = false
push_commands = ["/review", "/improve"]
