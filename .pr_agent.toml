[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
persistent_inline_comments = true  # fingerprint inline comments; identical ones never re-post across pushes
repo_context_from_default_branch = false
repo_context_files = [
    "docs/PRD.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "standards/coding-standards.md",
    "standards/testing-standards.md",
    "standards/ux-standards.md",
]

[pr_reviewer]
enable_incremental = true
persistent_comment = true  # update the same review comment instead of posting a new one
require_tests_review = true
require_security_review = true
num_max_findings = 50
extra_instructions = "Check the PR against each file in repo_context_files. Before checking compliance, derive the domain glossary from docs/PRD.md (entities, actions, personas, states), then read the diff against it two ways. Vocabulary: a domain-level name (class, module, public entry point, domain-typed field) using technical or vague words instead of the PRD's term is a finding. Latent concepts: domain behaviour smeared across several functions or buried inside one, owned by no identifier, is equally a finding — draw it out under a glossary name, proposing a new PRD term where none fits. Generic helper, plumbing, and config-key names are not glossary checks.  Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: requirement deviations from docs/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), documentation-standard deviations from docs/writing-documentation.md (docs failing the documentation-quality checklist — context efficiency, density, no-duplication, one topic per file — including that every doc is discoverable from AGENTS.md; skills are exempt from reachability — the harness discovers them (see docs/documentation-structure.md)), and folder-structure deviations from docs/documentation-structure.md (missing or malformed required docs, or a doc that AGENTS.md cannot lead to). The canonical code-repo standards (coding, testing, UX) live in standards/ and are scaffolded into code repos. They govern this repo's own code and tests; only the required-doc-set rules do not apply to its exempt docs/ folder, and a PR editing a canonical file keeps it consistent with the rest of the canonical set. A change to a skill or standard must keep the repo self-check (make test) green and mention that the change needs make install + omp restart to take effect."

[github_action_config]
handle_push_trigger = true
# Don't skip push synchronize events from bot senders: omp-harness's
# commits get the same review as human ones.
push_trigger_ignore_bot_commits = false
push_commands = ["/review", "/improve"]

[litellm]
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"omp-config\"}"}'

[pr_code_suggestions]
persistent_comment = true
commitable_code_suggestions = true  # suggestions post as line-anchored comments; the table wall is NOT published
dual_publishing_score_threshold = 6  # only >=6-score suggestions also mirror into the summary table
