[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
persistent_inline_comments = true  # fingerprint inline comments; identical ones never re-post across pushes
repo_context_from_default_branch = false
# The defaults cap the rendered context at 500 lines, and the renderer stops at
# the first file that overruns - everything after it is dropped, silently. The
# six files below are ~1180 lines together; a budget below that truncates mid
# file and loses the rest (coding/testing/UX standards went missing for months).
# Raise this whenever the list grows. See pr_agent/algo/repo_context.py.
repo_context_max_lines = 1400
repo_context_files = [
    "docs/PRD.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "standards/coding-standards.md",
    "standards/testing-standards.md",
    "standards/ux-standards.md",
]

[pr_reviewer]
enable_incremental = true
persistent_comment = true  # update the same review comment instead of posting a new one
require_tests_review = true
require_security_review = true
num_max_findings = 50
extra_instructions = """
Every markdown file this PR changes — docs/, skills/, standards/, AGENTS.md, rules/, APPEND_SYSTEM.md — is a doc under review. Check each one against docs/writing-documentation.md and docs/documentation-structure.md. Report every violation as its own finding with path:line and the rule it breaks, quoting the rule's words. Never report a doc as compliant unless you checked it against both.

Flag requirement deviations from docs/PRD.md as findings: a change that violates a stated requirement, constraint, persona, or JTBD. The canonical code-repo standards in standards/ govern this repo's own code and tests; a PR editing one keeps it consistent with the rest of the canonical set. A change to a skill or standard must keep the repo self-check (make test) green.
"""

[github_action_config]
handle_push_trigger = true
# Don't skip push synchronize events from bot senders: omp-harness's
# commits get the same review as human ones.
push_trigger_ignore_bot_commits = false
push_commands = ["/review", "/improve"]

[litellm]
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"omp-config\"}"}'

[pr_code_suggestions]
extra_instructions = """
Documentation is reviewed like code. For each markdown file in the diff, propose a concrete replacement line when it breaks docs/writing-documentation.md: a sentence over 30 words; a fact and a command in one sentence; a history lesson (a date, "we confirmed", "proven", "the former X is gone"); a fact stated twice; an undefined acronym. Anchor every suggestion to the line it replaces.
"""
persistent_comment = true
commitable_code_suggestions = true  # inline mode: the summarized table comment is never published (pr_code_suggestions.py:139); posting failures degrade to verified one-line comments, never a table
