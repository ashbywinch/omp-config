name: PR auto-merge (reusable)

# One copy of the arming and behind-branch refresh for every client repo. A
# caller keeps a short workflow:
#
#   on:
#     pull_request:
#     pull_request_review:
#       types: [submitted]
#     push:
#       branches: [main]
#     schedule:
#       - cron: '0 * * * *'
#     workflow_dispatch:
#   jobs:
#     automerge:
#       permissions:
#         contents: read
#       uses: ashbywinch/omp-config/.github/workflows/pr-automerge.yml@v0.2.7
#       with:
#         app_id: ${{ vars.OMP_APP_ID }}
#       secrets:
#         app_private_key: ${{ secrets.OMP_APP_PRIVATE_KEY }}
#
# Why the App token: GitHub does not run workflows for events caused by
# GITHUB_TOKEN. An App push, once made, is also treated as an outside
# contributor's: the runs it creates are parked as action_required, so this
# workflow approves them itself and the App needs Actions: write. An update-branch made with GITHUB_TOKEN leaves the PR head with
# no checks, and an auto-merge push to main fires no workflows. The App token
# makes both events real. The App needs Contents: write and Pull requests:
# write, and must be installed on the repo.
#
# The repo must have `allow_auto_merge` and `delete_branch_on_merge` enabled.
# A ruleset that requires an approving review plus the CI checks is still
# wanted — it is what holds `main` — but it is NOT the approval gate: this
# workflow arms only a PR whose head commit carries an approval, and disarms an
# armed PR as soon as a push moves the head past it. Without that, a PR based on
# a feature branch (no ruleset) merged itself with a red check (2026-11-15).
# This workflow never approves or merges directly.
#
# The hourly schedule is the fallback for a main merge that produced no
# event: it refreshes approved/armed PRs that fell behind.
#
# Same-repo branches only: a fork PR has no write access to arm it, and should
# not merge itself anyway.

on:
  workflow_call:
    inputs:
      app_id:
        description: GitHub App id whose installation token performs the writes.
        type: string
        required: true
      merge_method:
        description: merge, squash or rebase.
        type: string
        default: merge
    secrets:
      app_private_key:
        description: PEM private key for the GitHub App.
        required: true

permissions:
  contents: read

# Arming is idempotent and takes seconds, so a newer event must not cancel an in-flight run: the
# cancelled run is reported by `gh pr checks` as a failure, and if the cancelled one carried the
# approval the PR is left unarmed with nothing to show why.
concurrency:
  group: pr-automerge-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve repository name
        id: repo
        # GITHUB_REPOSITORY is present on every event, including schedule;
        # github.event.repository is not guaranteed there.
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          # Least privilege: the installation may cover more repos and
          # permissions; the token is narrowed to this repo and the two writes
          # this workflow performs.
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          # The App's own update-branch pushes are attributed to an App actor, which GitHub treats as
          # an outside contributor: every workflow on the new head is created "action_required" and
          # nothing runs until somebody approves it. This permission lets the next step approve them
          # itself, so the refresh it just made does not park the PR.
          permission-actions: write
      - name: Arm auto-merge, or refresh approved PRs behind main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || '' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          MERGE_METHOD: ${{ inputs.merge_method || 'merge' }}
        run: |
          set -euo pipefail
          case "$MERGE_METHOD" in
            merge|squash|rebase) ;;
            *) echo "invalid merge_method: $MERGE_METHOD" >&2; exit 1 ;;
          esac

          case "$EVENT" in
            pull_request|pull_request_review)
              if [ "$HEAD_REPO" != "$REPO" ]; then
                echo "fork PR — not arming"; exit 0
              fi
              if [ "$DRAFT" = "true" ]; then
                echo "draft PR — not arming"; exit 0
              fi
              # Idempotent: every push fires this, and an already-armed PR must
              # not fail the job. `--jq` prints an EMPTY line for a null field.
              armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest')
              # THE APPROVAL GATE LIVES HERE, not only in a ruleset. A ruleset
              # covers the default branch, and this workflow is called for PRs
              # into ANY base: a PR stacked on a feature branch had no ruleset,
              # so it armed, merged itself with a failing check and an unanswered
              # review thread (the-loft, 2026-11-15). And an approval of an
              # earlier commit is not an approval of this one — GitHub keeps
              # REVIEW_REQUIRED's state across pushes unless a ruleset dismisses
              # stale reviews, so the approval is matched to the head SHA.
              head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
              # one line per approval across every page, last wins: `gh api`
              # applies --jq page by page, so the reduction happens here
              approved=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | select(.state == "APPROVED") | .commit_id' | tail -n 1)
              # Strictly the head commit: an approval is of the code that was
              # read. A push after it — the fix a reviewer asked for, or the
              # behind-branch update — means nobody has read this head, so the
              # arm is withdrawn and the reviewer approves again. The cost is a
              # second click after a base merge; the alternative is an approval
              # standing for code its author never saw.
              if [ -z "$approved" ] || [ "$approved" != "$head" ]; then
                echo "no approval covering the head ($head) — not arming"
                if [ -n "$armed" ] && [ "$armed" != "null" ]; then
                  gh pr merge "$PR" --repo "$REPO" --disable-auto
                  echo "auto-merge disarmed: a commit moved the head past the approval"
                fi
                exit 0
              fi
              case "$armed" in
                "" | null) : ;;
                *)
                  echo "auto-merge already armed"
                  exit 0
                  ;;
              esac
              # An update-branch creates a new head whose workflows GitHub parks as action_required,
              # because the App actor counts as an outside contributor. Approve them here rather than
              # leaving the PR waiting on a click. Retried: run creation lags the push.
              approve_head() {
                local pr="$1" head runs run
                head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
                for _ in 1 2 3 4 5 6; do
                  sleep 5
                  runs=$(gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=50" \
                    --jq '[.workflow_runs[] | select(.conclusion == "action_required") | .id] | .[]' 2>/dev/null || true)
                  [ -z "$runs" ] && continue
                  for run in $runs; do
                    if gh api -X POST "repos/$REPO/actions/runs/$run/approve" >/dev/null 2>&1; then
                      echo "approved run $run for $head"
                    else
                      echo "could not approve run $run for $head (App needs Actions: write)" >&2
                    fi
                  done
                done
              }

              # A branch behind main blocks the strict status check. BEHIND is
              # mergeable-but-stale; a real conflict reports DIRTY/CONFLICTING
              # and is not updated here. The App token makes the update fire CI.
              state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
              echo "merge state: $state"
              if [ "$state" = "BEHIND" ]; then
                if ! out=$(gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" 2>&1); then
                  echo "update-branch failed: $out" >&2
                  exit 1
                fi
                echo "branch updated"
                approve_head "$PR"
              fi
              gh pr merge "$PR" --repo "$REPO" --auto --"$MERGE_METHOD"
              ;;
            push|workflow_dispatch|schedule)
              # A main merge produces no event on an open PR, so an approved PR
              # can sit BEHIND forever. Refresh the branches that are ready to
              # land: same-repo, non-draft, approved or already armed.
              owner="${REPO%%/*}"
              gh pr list --repo "$REPO" --state open --limit 100 \
                --json number,isDraft,mergeStateStatus,reviewDecision,autoMergeRequest,headRepositoryOwner |
              jq -r --arg owner "$owner" '
                .[]
                | select(.isDraft == false)
                | select(.mergeStateStatus == "BEHIND")
                | select(.headRepositoryOwner.login == $owner)
                | select(.reviewDecision == "APPROVED")
                | .number
              ' |
              while read -r pr; do
                [ -n "$pr" ] || continue
                echo "updating #$pr"
                gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null
                approve_head "$pr"
              done
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac
