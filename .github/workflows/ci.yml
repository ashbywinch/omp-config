name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# `push` is main-only ON PURPOSE: a wider filter fires BOTH pull_request and
# push for every PR-branch push — two runs over the identical head SHA.
# Main-only means: PR pushes get exactly one run (pull_request), and each
# merge gets exactly one post-merge run on main.

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      # make test provisions the lucidlint bundle itself (test depends on
      # install-lucidlint) — dev and CI run the identical entry point.
      - uses: actions/checkout@v4
      # Pinned, and checked by `make test`: the runner image's default python3
      # is not the version the tools are developed on, and 3.14 changed
      # annotation evaluation, which made a forward reference pass here and
      # raise NameError there.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: make test
