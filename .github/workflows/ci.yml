name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lucidlint is consumed as the release bundle (pinned to a tag, never
      # main — house rule). v0.3.0 carries the dict()-call record-shape fix.
      - run: make install-lucidlint
      - run: make test
