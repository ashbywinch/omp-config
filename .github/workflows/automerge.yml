name: Arm auto-merge

# GitHub's auto-merge is a per-PR flag, and nothing sets it automatically: the
# repo-level "allow auto-merge" setting only permits one to exist. This job arms
# it on every PR in this repo, so an approval is the only remaining action —
# once the required checks pass and every review thread is resolved, the PR
# merges itself. It does not approve anything; the ruleset still demands one
# approving review.
#
# Same-repo branches only: a fork PR has no write access to arm it, and should
# not merge itself anyway.
#
# Also clears the one other click: with `strict_required_status_checks_policy`,
# a PR whose branch is behind main cannot merge until it is updated. Update it
# here instead of asking for a button press.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # Arming once at open is not enough: GitHub can drop auto-merge (it did on the
  # first PR this ran for) and a dropped flag leaves the approval doing nothing.
  # Re-arming on the review itself means the approval always lands, whichever
  # way the flag got lost.
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write        # update-branch
  pull-requests: write   # enable auto-merge

jobs:
  arm:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run (every push fires this) must not fail on an
          # already-armed PR.
          armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest')
          if [ "$armed" != "null" ]; then
            echo "auto-merge already armed"
            exit 0
          fi
          # A branch behind main blocks the strict status check. Updating it
          # pushes a merge commit, which re-fires this job; the next run arms.
          state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
          echo "merge state: $state"
          if [ "$state" = "BEHIND" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" >/dev/null 2>&1 \
              && echo "branch updated" || echo "update refused (nothing to do)"
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --merge
