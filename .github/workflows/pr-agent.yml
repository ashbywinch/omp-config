name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: the-pr-agent/pr-agent@v0.41.1   # pin a real release tag — @latest does not resolve
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_OMP_CONFIG_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY: pin the config to a maintainer-controlled branch. Using
          # ${{ github.head_ref }} lets any same-repo branch ship its own
          # .pr_agent.toml (e.g. api_base pointing at an attacker endpoint)
          # and exfiltrate OPENCODE_GO_OMP_CONFIG_API_KEY.
          PR_AGENT_CONFIG_BRANCH: pr-agent-config
  verify:
    # A SEPARATE job that runs AFTER the bot job completes: GitHub does not
    # serve a job's log until it finishes, so check_review_posted.py can only
    # read the bot's failure reason from here — inside the bot's own job the
    # log endpoint returns 409 and the reason is always the generic fallback.
    needs: pr-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # read the bot's completed run log for the failure reason
    steps:
      - uses: actions/checkout@v4
      - name: Fail loud if no review covers the head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # SECURITY: python3 -I (isolated) keeps the PR checkout off sys.path —
        # a repo-root json.py/urllib.py/sitecustomize.py must not shadow the
        # script's stdlib imports and run code with GITHUB_TOKEN.
        run: python3 -I tools/check_review_posted.py
