name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: the-pr-agent/pr-agent@v0.41.1   # pin a real release tag — @latest does not resolve
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_OMP_CONFIG_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY: pin the config to a maintainer-controlled branch. Using
          # ${{ github.head_ref }} lets any same-repo branch ship its own
          # .pr_agent.toml (e.g. api_base pointing at an attacker endpoint)
          # and exfiltrate OPENCODE_GO_OMP_CONFIG_API_KEY.
          PR_AGENT_CONFIG_BRANCH: pr-agent-config
      - name: Fail loud if no review covers the head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Shared tool, fetched from the pinned build-tools tag (never main —
          # a later change must not silently alter what CI runs).
          curl -fsSL -o check_review_posted.py \
            https://raw.githubusercontent.com/ashbywinch/build-tools/v1/check_review_posted.py
          python3 check_review_posted.py
