name: Merge when approved

# GitHub's own auto-merge is unavailable on a private repo without GitHub Pro,
# so this job does the same thing by hand: when a PR is approved, every review
# thread is resolved, and every check has passed, it merges.
#
# It does not approve anything. The approval has to come from a person, and the
# thread resolution has to come from whoever raised the thread. This job only
# removes the last click.
#
# Same-repo branches only: a fork PR cannot be merged by this token, and should
# not merge itself anyway.

on:
  # For client repos that cannot use GitHub's own auto-merge — a private repo
  # without Pro.
  #
  #   jobs:
  #     merge:
  #       uses: ashbywinch/omp-config/.github/workflows/merge-when-approved.yml@v0.2.2
  workflow_call:
    inputs:
      merge_method:
        description: merge, squash or rebase.
        type: string
        default: merge
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # There is no `pull_request_review_thread` trigger: it is a webhook event, not
  # an Actions event, and naming it here makes GitHub reject the whole file — the
  # workflow then never runs at all, which is silent until you look. Resolving a
  # thread after everything else is therefore not noticed; re-run by hand
  # (workflow_dispatch) when that happens.
  check_suite:
    types: [completed]
  status: {}
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    # Runs for every trigger this workflow has. On check_suite/status there is no
    # pull_request object at all — that is the point: those are how an approved
    # PR whose checks had not finished gets re-examined. Only a draft is excluded.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge if approved, resolved and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || '' }}
          SHA: ${{ github.event.check_suite.head_sha || github.event.status.sha || github.sha }}
          MERGE_METHOD: ${{ inputs.merge_method || 'merge' }}
        run: |
          set -euo pipefail

          pr="$PR_FROM_EVENT"
          if [ -z "$pr" ]; then
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "no pull request for this event — nothing to do"; exit 0
          fi
          echo "evaluating PR #$pr"

          # Everything below is re-read rather than remembered: this job can wait
          # fifteen minutes, and an approval, a check or a thread can change in
          # that time. Deciding on a stale value is how a PR merges on an approval
          # that was withdrawn.

          # The check state this job waits on, with its own run removed: its
          # `merge` check is in progress while it decides, so the aggregate
          # rollup never reaches SUCCESS and the wait would watch itself.
          check_state() {
            gh pr checks "$pr" --repo "$REPO" --json name,state 2>/dev/null \
              | jq -r '[.[] | select(.name != "merge") | .state]
                  | if index("FAILURE") then "FAILURE"
                    elif index("PENDING") then "PENDING"
                    elif index("CANCELLED") then "CANCELLED"
                    else "SUCCESS" end' 2>/dev/null || echo "UNKNOWN"
          }

          read_state() {
            local check
            check=$(check_state)
            gh api graphql -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewDecision
                    mergeStateStatus
                    headRepository { nameWithOwner }
                    commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
                  }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '.data.repository.pullRequest
                    | [(.reviewDecision // "NONE"),
                       .mergeStateStatus,
                       "${check}",
                       (.headRepository.nameWithOwner // "")]
                    | @tsv'
          }

          # Threads are paginated: first:100 reports zero unresolved on a PR with
          # more than a hundred, and merges it with threads still open. A failed
          # query is fatal, not zero — an unreadable answer must never read as
          # "no unresolved threads".
          count_threads() {
            local total=0 cursor="" page
            while : ; do
              if ! page=$(gh api graphql -f query='
                query($owner: String!, $repo: String!, $pr: Int!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { isResolved }
                      }
                    }
                  }
                }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" -F after="$cursor"); then
                echo "::error::could not read review threads — refusing to merge on an unknown answer" >&2
                exit 3
              fi
              if ! printf '%s' "$page" | jq -e '.data.repository.pullRequest.reviewThreads' >/dev/null 2>&1; then
                echo "::error::review thread query returned no data — refusing to merge on an unknown answer" >&2
                exit 3
              fi
              total=$(( total + $(printf '%s' "$page" | jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length') ))
              if [ "$(printf '%s' "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')" != "true" ]; then
                break
              fi
              cursor=$(printf '%s' "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty')
            done
            echo "$total"
          }

          # Checks usually finish after the approval that started this job, and the
          # last one to finish is often the review the PR is waiting on. Wait for
          # them rather than deciding on a snapshot.
          for attempt in $(seq 1 15); do
            read -r decision state checks head_repo < <(read_state)
            open_threads=$(count_threads) || exit $?

            echo "attempt $attempt — review: $decision | state: $state | checks: $checks | threads: $open_threads | head: $head_repo"

            if [ "$head_repo" != "$REPO" ]; then
              echo "fork PR — not merged here"; exit 0
            fi
            if [ "$decision" != "APPROVED" ]; then
              echo "not approved — nothing to do"; exit 0
            fi
            if [ "$open_threads" != "0" ]; then
              echo "$open_threads review thread(s) unresolved — not merging"; exit 0
            fi
            if [ "$checks" = "SUCCESS" ]; then
              break
            fi
            case "$checks" in
              PENDING|QUEUED|IN_PROGRESS|EXPECTED) ;;
              *) echo "checks are $checks — not merging"; exit 0 ;;
            esac
            if [ "$attempt" -eq 15 ]; then
              echo "checks still $checks after 15 minutes — leaving it"; exit 0
            fi
            sleep 60
          done

          # One last read, after the wait: the loop's last look can be a minute
          # old, and every condition it checked can have changed since.
          read -r decision state checks head_repo < <(read_state)
          open_threads=$(count_threads) || exit $?
          echo "final — review: $decision | state: $state | checks: $checks | threads: $open_threads"

          if [ "$head_repo" != "$REPO" ]; then echo "fork PR — not merged here"; exit 0; fi
          if [ "$decision" != "APPROVED" ]; then echo "approval is now $decision — not merging"; exit 0; fi
          if [ "$open_threads" != "0" ]; then echo "$open_threads review thread(s) unresolved — not merging"; exit 0; fi
          if [ "$checks" != "SUCCESS" ]; then echo "checks are $checks — not merging"; exit 0; fi

          case "$state" in
            CLEAN) ;;
            BEHIND)
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null
              echo "branch updated; the next run merges"
              exit 0 ;;
            *)
              echo "merge state is $state — not merging"; exit 0 ;;
          esac

          gh pr merge "$pr" --repo "$REPO" --"$MERGE_METHOD"
