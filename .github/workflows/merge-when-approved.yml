name: Merge when approved

# GitHub's own auto-merge is unavailable on a private repo without GitHub Pro,
# so this job does the same thing by hand: when a PR is approved, every review
# thread is resolved, and every check has passed, it merges.
#
# It does not approve anything. The approval has to come from a person, and the
# thread resolution has to come from whoever raised the thread. This job only
# removes the last click.
#
# The checks are read without this job's own check run. A reusable workflow's
# job appears in the PR's status rollup as `merge / merge`, so a gate that reads
# the rollup is waiting on itself: it reports PENDING for the whole fifteen
# minutes it waits, then gives up, and the PR sits green and unmerged. The read
# below drops the check run whose details_url points at this run.
#
# Same-repo branches only: a fork PR cannot be merged by this token, and should
# not merge itself anyway.

on:
  # For client repos that cannot use GitHub's own auto-merge — a private repo
  # without Pro.
  #
  #   jobs:
  #     merge:
  #       uses: ashbywinch/omp-config/.github/workflows/merge-when-approved.yml@v0.2.2
  workflow_call:
    inputs:
      merge_method:
        description: merge, squash or rebase.
        type: string
        default: merge
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # There is no `pull_request_review_thread` trigger: it is a webhook event, not
  # an Actions event, and naming it here makes GitHub reject the whole file — the
  # workflow then never runs at all, which is silent until you look. Resolving a
  # thread after everything else is therefore not noticed; re-run by hand
  # (workflow_dispatch) when that happens.
  check_suite:
    types: [completed]
  # No `workflow_run` here: this file is called as a reusable workflow, and a
  # bare workflow_run trigger with no `workflows:` list makes the whole call
  # invalid ("does not reference any workflows"). The caller owns that trigger;
  # this job only has to read the event it is handed.
  status: {}
  workflow_dispatch:

permissions:
  contents: write       # update-branch, merge
  pull-requests: write  # read the PR, merge it
  checks: read          # the PR's check runs
  statuses: read        # the legacy commit statuses, where a repo uses those
  actions: write        # dispatch the required check after update-branch

jobs:
  merge:
    # Runs for every trigger this workflow has. On check_suite/status there is no
    # pull_request object at all — that is the point: those are how an approved
    # PR whose checks had not finished gets re-examined. Only a draft is excluded.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge if approved, resolved and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || '' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.event.status.sha || github.sha }}
          MERGE_METHOD: ${{ inputs.merge_method || 'merge' }}
        run: |
          set -euo pipefail

          pr="$PR_FROM_EVENT"
          if [ -z "$pr" ]; then
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "no pull request for this event — nothing to do"; exit 0
          fi
          echo "evaluating PR #$pr"

          # Everything below is re-read rather than remembered: this job can wait
          # fifteen minutes, and an approval, a check or a thread can change in
          # that time. Deciding on a stale value is how a PR merges on an approval
          # that was withdrawn.

          read_state() {
            gh api graphql -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewDecision
                    mergeStateStatus
                    headRepository { nameWithOwner }
                  }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '.data.repository.pullRequest
                    | [(.reviewDecision // "NONE"),
                       .mergeStateStatus,
                       (.headRepository.nameWithOwner // "")]
                    | @tsv'
          }

          # The checks, read without this job's own check run. The rollup cannot
          # be used: this job is in it, so it stays PENDING for as long as the job
          # waits, and the wait is for SUCCESS. The check run whose details_url
          # points at this run is dropped; everything else counts as before, and
          # a legacy commit status still counts when a repo uses those.
          #
          # Only the latest run of each check name counts. A job with
          # `cancel-in-progress` leaves a cancelled run behind on the same commit
          # every time it is superseded, and counting those blocks the merge on
          # work that was replaced by a green run.
          read_checks() {
            local sha runs legacy
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha') || return 1
            runs=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              | jq --slurp '.') || return 1
            legacy=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq 'if (.statuses | length) == 0 then "SUCCESS"
                    elif .state == "success" then "SUCCESS"
                    elif .state == "pending" then "PENDING"
                    else "FAILURE" end') || return 1
            printf '%s' "$runs" | jq -r --arg run "$GITHUB_RUN_ID" --arg legacy "$legacy" '
              [ .[].check_runs[]
                | select((.details_url // "") | contains("/runs/" + $run + "/") | not) ]
              | group_by(.name)
              | map(sort_by(.id) | last) as $c
              | if ($c | map(select(.conclusion == "failure" or .conclusion == "timed_out"
                                   or .conclusion == "cancelled" or .conclusion == "action_required"
                                   or .conclusion == "startup_failure")) | length) > 0 then "FAILURE"
                elif ($c | map(select(.status != "completed")) | length) > 0 then "PENDING"
                elif $legacy == "FAILURE" then "FAILURE"
                elif $legacy == "PENDING" then "PENDING"
                elif ($c | length) == 0 then "EXPECTED"
                else "SUCCESS" end'
          }

          # Threads are paginated: first:100 reports zero unresolved on a PR with
          # more than a hundred, and merges it with threads still open. A failed
          # query is fatal, not zero — an unreadable answer must never read as
          # "no unresolved threads".
          count_threads() {
            local total=0 cursor="" page
            while : ; do
              if ! page=$(gh api graphql -f query='
                query($owner: String!, $repo: String!, $pr: Int!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { isResolved }
                      }
                    }
                  }
                }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" -F after="$cursor"); then
                echo "::error::could not read review threads — refusing to merge on an unknown answer" >&2
                exit 3
              fi
              if ! printf '%s' "$page" | jq -e '.data.repository.pullRequest.reviewThreads' >/dev/null 2>&1; then
                echo "::error::review thread query returned no data — refusing to merge on an unknown answer" >&2
                exit 3
              fi
              total=$(( total + $(printf '%s' "$page" | jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length') ))
              if [ "$(printf '%s' "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')" != "true" ]; then
                break
              fi
              cursor=$(printf '%s' "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty')
            done
            echo "$total"
          }

          # Checks usually finish after the approval that started this job, and the
          # last one to finish is often the review the PR is waiting on. Wait for
          # them rather than deciding on a snapshot.
          updated=0
          for attempt in $(seq 1 15); do
            read -r decision state head_repo < <(read_state)
            checks=$(read_checks) || exit 3
            open_threads=$(count_threads) || exit $?

            echo "attempt $attempt — review: $decision | state: $state | checks: $checks | threads: $open_threads | head: $head_repo"

            if [ "$head_repo" != "$REPO" ]; then
              echo "fork PR — not merged here"; exit 0
            fi
            if [ "$decision" != "APPROVED" ]; then
              echo "not approved — nothing to do"; exit 0
            fi
            if [ "$open_threads" != "0" ]; then
              echo "$open_threads review thread(s) unresolved — not merging"; exit 0
            fi

            # A branch behind the base cannot merge, and this job is the only
            # actor that updates it. The update commits with GITHUB_TOKEN, and a
            # push made with that token starts no workflow runs, so the new head
            # would carry no checks: dispatch the required one by hand, then
            # keep waiting in this same run for it to finish.
            if [ "$state" = "BEHIND" ]; then
              if [ "$updated" = "1" ]; then
                echo "branch updated; waiting for the dispatched check"
              else
                updated=1
                head_ref=$(gh api "repos/$REPO/pulls/$pr" --jq .head.ref) || exit 3
                if ! gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null; then
                  echo "::error::update-branch failed for $head_ref" >&2
                  exit 3
                fi
                if ! gh workflow run ci.yml --repo "$REPO" --ref "$head_ref"; then
                  echo "::error::could not dispatch ci.yml on $head_ref — the required check will never run" >&2
                  exit 3
                fi
                # the dispatched run's check_suite completion re-triggers this
                # workflow, so a wait that runs out still gets another pass
                echo "branch updated and ci.yml dispatched on $head_ref; waiting for its check"
              fi
              sleep 60
              continue
            fi

            if [ "$checks" = "SUCCESS" ]; then
              break
            fi
            case "$checks" in
              PENDING|QUEUED|IN_PROGRESS|EXPECTED) ;;
              *) echo "checks are $checks — not merging"; exit 0 ;;
            esac
            if [ "$attempt" -eq 15 ]; then
              echo "checks still $checks after 15 minutes — leaving it"; exit 0
            fi
            sleep 60
          done

          # One last read, after the wait: the loop's last look can be a minute
          # old, and every condition it checked can have changed since.
          read -r decision state head_repo < <(read_state)
          checks=$(read_checks) || exit 3
          open_threads=$(count_threads) || exit $?
          echo "final — review: $decision | state: $state | checks: $checks | threads: $open_threads"

          if [ "$head_repo" != "$REPO" ]; then echo "fork PR — not merged here"; exit 0; fi
          if [ "$decision" != "APPROVED" ]; then echo "approval is now $decision — not merging"; exit 0; fi
          if [ "$open_threads" != "0" ]; then echo "$open_threads review thread(s) unresolved — not merging"; exit 0; fi
          if [ "$checks" != "SUCCESS" ]; then echo "checks are $checks — not merging"; exit 0; fi

          # read_checks drops the check run whose details_url points at this
          # run, and confirmed every other check is SUCCESS. The mergeability
          # endpoint still counts this job's in-progress check, so it reports
          # UNSTABLE; accept it here, or the job can never merge the PR it is
          # checking.
          case "$state" in
            CLEAN|UNSTABLE) ;;
            BEHIND)
              # The base moved after the wait loop. The loop owns the update, so
              # leave it there: this run ends, and the next check_suite run
              # takes the BEHIND path with its own wait.
              echo "base moved after the wait — leaving the update to the next run"
              exit 0 ;;
            *)
              echo "merge state is $state — not merging"; exit 0 ;;
          esac

          gh pr merge "$pr" --repo "$REPO" --"$MERGE_METHOD"
