providers:
  cloudflare-gateway:
    baseUrl: http://localhost:9123/v1
    apiKey: CLOUDFLARE_AIGATEWAY_TOKEN
    api: openai-completions
    models:
      - id: dynamic/fallback2
        name: Coding (route picks the provider)
        contextWindow: 1000000
        maxTokens: 128000
      - id: dynamic/image
        name: Vision (route picks the provider)
        contextWindow: 1000000
        maxTokens: 128000
        input: [text, image]