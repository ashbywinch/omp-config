# CI — delegates to make, never raw cargo commands (Rust variant).
#
# CHANGE: adjust the coverage thresholds to your repo's measured number
# (65 floor / 80 goal is the sane starting point for an EXISTING codebase
# — a hard 80 gate on day one is a broken CI).
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo uses cancel-in-progress.
# - Steps are exactly make targets. Never inline cargo logic into the
#   workflow — CI and local dev must run the same recipes.
# - The toolchain comes from rust-toolchain.toml — the action only ensures
#   rustup is present; rustup honors the file's channel in this directory,
#   the same version local rustup uses. Never a separate `rustup toolchain
#   install` line that can drift from the pin.
# - Lint runs via `make lint-github` (clippy -D warnings, JSON diagnostics in
#   the step log) — it fails the build on any clippy warning.

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: make setup
      - run: make lint-github
      - run: make test
      - run: make coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          badge: true
          fail_below_min: true
          thresholds: '65 80'
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
