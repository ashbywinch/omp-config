# Dependabot auto-merge — patch/minor dependabot PRs merge themselves once
# required checks pass.
#
# CHANGE: none — this file is the house shape. A repo that merges by squash
# instead of merge commits changes `--merge` to `--squash` (a standards
# discussion, not a local edit).
#
# DO NOT CHANGE:
# - The semver gate: majors stay human (CI green is not compatibility).
# - github-actions bumps are never auto-merged: action ref bumps are pin
#   updates per the coding standard (actions pin to commit SHAs) and need
#   the SHA-pin treatment by a human.
# - dependabot/fetch-metadata is pinned to a commit SHA, never the tag.
# - Non-dependabot PRs are untouched (job-level actor guard).
# - The trigger is pull_request_target, NOT pull_request: dependabot-triggered
#   pull_request runs get a read-only token and NO secrets, so `gh pr merge`
#   can never work there. The target trigger runs in base-repo context with
#   real permissions; the actor guard still limits it to dependabot PRs, and
#   the job never checks out PR code, so the trigger is safe.
# - contents: write — the auto-merge performs a merge commit; read alone
#   fails the arm step.
# - Allow auto-merge must be enabled in the repo: Settings → General → Pull
#   Requests → Allow auto-merge.
# - Any OTHER CI step that needs a secret (an eval gate, a review) fails on
#   dependabot PRs for the same reason: skip it ONLY for the actor
#   dependabot[bot] (never by a key-presence test), and always run it on main.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write # the auto-merge performs the merge commit
  pull-requests: write # enabling auto-merge on the PR

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for patch and minor updates
        if: ${{ steps.metadata.outputs.package-ecosystem != 'github_actions' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"
