# CI — delegates to make, never raw tool commands.
#
# CHANGE: add path-filtered jobs for subprojects (see SKILL.md §2); adjust
# the coverage thresholds to your repo's measured number (65 floor / 80 goal
# is the sane starting point for an EXISTING codebase — a hard 80 gate on
# day one is a broken CI).
#
# CHANGE (JS/TS repos): the coverage step reads the stack's report —
# Python: irongut/CodeCoverageSummary on coverage.xml (as below); JS/TS:
# slavcodev/coverage-monitor-action on coverage/clover.xml. Keep the make
# steps identical; only the coverage action + filename swap.
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo uses cancel-in-progress.
# - Steps are exactly make targets. Never inline pip/npm logic into the
#   workflow — CI and local dev must run the same recipes.
# - Lint runs via `make lint-github` so findings surface as PR annotations.

name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make lint-github
      - run: make test
      - run: make coverage
      - name: Coverage summary
        # Pinned to the v1.3.0 commit SHA, never the mutable tag — third-party
        # action tags move, and a moved tag is a supply-chain hole.
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '80 90'
          format: markdown
          output: both
      - name: Post coverage comment
        # Pinned to the v3.0.5 commit SHA (same interface as v2) — see the
        # pinning note on the coverage step above.
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
