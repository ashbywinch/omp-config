# CI — delegates to make, never raw tool commands.
#
# CHANGE: add path-filtered jobs for subprojects (see SKILL.md §2); adjust
# the coverage thresholds to your repo's measured number (65 floor / 80 goal
# is the sane starting point for an EXISTING codebase — a hard 80 gate on
# day one is a broken CI).
#
# CHANGE (JS/TS repos): the coverage step reads the stack's report —
# Python: irongut/CodeCoverageSummary on coverage.xml (as below); JS/TS:
# slavcodev/coverage-monitor-action on coverage/clover.xml. Keep the make
# steps identical; only the coverage action + filename swap.
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo uses cancel-in-progress.
# - Pipeline logic is make-only. Never inline pip/npm logic into the
#   workflow — CI and local dev must run the same recipes; tool bootstrap
#   and result plumbing steps (checkout, the coverage actions) are exempt.
# - Lint runs via `make lint-github` so findings surface as PR annotations.

name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Every action pins to a commit SHA with its version as a trailing
      # comment — mutable tags move; the sticky-comment action's bare `v2` tag
      # no longer even exists upstream. SHAs verified against ls-remote tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make setup
      - run: make lint-github
      - run: make test
      - run: make coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '80 90'
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4 (latest v2; bare v2 tag deleted upstream)
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
