# Caller for the house PR auto-merge. Copy this file into a repo, then:
#   gh api -X PATCH repos/<owner>/<name> \
#     -F allow_auto_merge=true -F delete_branch_on_merge=true
#   and require one approving review plus the CI checks in the main ruleset.
# Private repo without GitHub Pro: use merge-when-approved.yml instead.
# The reusable workflow never approves or merges directly.
name: PR auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
    uses: ashbywinch/omp-config/.github/workflows/pr-automerge.yml@v0.2.6
