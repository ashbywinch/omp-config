# AI Code Review (the-pr-agent) — the house review bot.
#
# CHANGE: `<PROJECT>_API_KEY` -> your repo secret name. The secret value is
# the house provider key for THIS project (the "opencode-go" entry from the
# account's auth file). Set it BEFORE the first PR — the job fails fast
# without it (observed: secret created after the PR-open event, run dead in
# 6s). A wrong entry (another provider's key) fails every run with
# "Incorrect API key provided: sk-..." — the endpoint says exactly that, so
# when the check step errors with it, verify the secret's value, not the
# model or the endpoint (the-loft 2026-08-08).
#
# DO NOT CHANGE:
# - NO actions/checkout here — deliberate. PR-Agent fetches everything via
#   the GitHub API (the pinned config branch, the diff, the repo context
#   files), and the action's config loader ALSO merges a [tool.pr-agent]
#   section from pyproject.toml found in the working tree. With a checkout
#   of the PR head, an attacker branch could ship its own pyproject.toml
#   overriding [openai] api_base; with no checkout there is no working-tree
#   config to read at all.
# - PR_AGENT_CONFIG_BRANCH: config MUST come from a maintainer-controlled
#   branch — a PR branch could ship its own .pr_agent.toml pointing
#   api_base at an attacker endpoint, and the API key would be sent there
#   as the Bearer token. (.pr_agent.toml is fetched via the API from this
#   branch; 404 falls back to the default branch — never the working tree.)
#   This is ALSO the only way the config applies at all: the action gates
#   repo .pr_agent.toml keys by per-host allowed-keys, so without the pin
#   the image defaults run (model gpt-5.6, api_base api.openai.com) and the
#   model call dies with "Incorrect API key". Missing pin, not the key, is
#   the first thing to check when that error shows.
# - Pin the action to a real release SHA (see houses' workflow) — @latest
#   does not resolve. `the-pr-agent/pr-agent@<pinned-sha>`.
# - The `if:` on the job: dependabot bumps are mechanical and covered by
#   build-and-test; the AI review adds noise and its ticket-compliance step
#   chokes on dependabot descriptions (no ticket ref). Skip the whole job.
# - The "Check review succeeded" step: fails the PR when no review comment
#   covers the head commit. The matcher looks for a comment starting "## PR
#   Reviewer Guide" AND (containing the head SHA OR posted after the head
#   commit landed) — v0.41.1 reviews NEVER contain the head SHA, so a
#   SHA-in-body-only match fails even when the review posted (the-loft
#   2026-08-08). Must PASS when a human posted "/skip" (skip_commands in
#   .pr_agent.toml — pr-agent posts nothing on a skip).

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
# One review at a time per PR; a newer push cancels the stale run rather than
# queueing behind it (rapid fix pushes never stack — the incremental /review
# -i config in .pr_agent.toml supersedes the cancelled run's review with the
# new push's incremental review anyway).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    runs-on: ubuntu-latest
    # Dependabot bumps are mechanical and already covered by build-and-test;
    # the AI review adds noise (and dependabot PRs lack a ticket, which the
    # ticket-compliance step chokes on). Skip the whole job for them.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: the-pr-agent/pr-agent@b249e568e0c0fb6c674ace55fe95d02f62f8f3b3   # pin a real release SHA — @latest does not resolve
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.<PROJECT>_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: pr-agent-config

      # Fail the PR when no "## PR Reviewer Guide" comment covers the head
      # commit: the comment matches by prefix + (SHA in body OR posted after
      # the head commit landed) — the SHA-in-body fallback exists because
      # v0.41.1's first review on a PR is posted without the SHA marker.
      # Match BOTH headers: the regular review posts "## PR Reviewer Guide"
      # and the incremental (-i) review posts "## Incremental PR Reviewer
      # Guide" — the check must not fail a review that succeeded (2026-08-11:
      # the first incremental run was missed exactly this way).
      - name: Check review succeeded
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh api --paginate emits ONE JSON array per page — slurp (-s) and
          # concat, or a 31+ comment PR makes this a multi-line string that
          # never equals "true" (a false failure — the-loft 2026-08-08 review).
          comments="$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate | jq -s 'add')"
          if printf '%s' "$comments" | jq -e 'any(.body == "/skip")' >/dev/null; then
            echo "review skipped by a human (/skip)"
            exit 0
          fi
          head_date="$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.committer.date)"
          covered="$(printf '%s' "$comments" | jq -r --arg sha "$SHA" --arg hd "$head_date"             '[.[] | select(.body | startswith("## PR Reviewer Guide") or .body | startswith("## Incremental PR Reviewer Guide"))]
             | any(.created_at >= $hd or (.body | contains($sha)))')"
          if [ "$covered" != "true" ]; then
            echo "::error::AI review did not post for commit $SHA — the review may have failed silently."
            exit 1
          fi
          echo "review posted for $SHA"
