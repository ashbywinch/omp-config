# AI Code Review (the-pr-agent) — the house review bot.
#
# CHANGE: `<PROJECT>_API_KEY` -> your repo secret name. The secret value is
# the Cloudflare AI Gateway token (same for all projects). Set it BEFORE
# the first PR — the job fails fast without it. For forkers: use your own
# provider's API key and update api_base / model in .pr_agent.toml.
#
# DO NOT CHANGE:
# - NO actions/checkout in the pr-review job — deliberate. PR-Agent fetches
#   everything via the GitHub API (the pinned config branch, the diff, the
#   repo context files), and the action's config loader ALSO merges a
#   [tool.pr-agent] section from pyproject.toml found in the working tree.
#   With a checkout of the PR head, an attacker branch could ship its own
#   pyproject.toml overriding [openai] api_base; with no checkout there is
#   no working-tree config to read at all.
# - PR_AGENT_CONFIG_BRANCH: config MUST come from a maintainer-controlled
#   branch — a PR branch could ship its own .pr_agent.toml pointing
#   api_base at an attacker endpoint, and the API key would be sent there
#   as the Bearer token. (.pr_agent.toml is fetched via the API from this
#   branch; 404 falls back to the default branch — never the working tree.)
#   This is ALSO the only way the config applies at all: the action gates
#   repo .pr_agent.toml keys by per-host allowed-keys, so without the pin
#   the image defaults run (model gpt-5.6, api_base api.openai.com) and the
#   model call dies with "Incorrect API key". Missing pin, not the key, is
#   the first thing to check when that error shows.
# - Pin the action to a real release SHA (see houses' workflow) — @latest
#   does not resolve. `the-pr-agent/pr-agent@<pinned-sha>`.
# - The `if:` on the job: dependabot bumps are mechanical and covered by
#   build-and-test; the AI review adds noise and its ticket-compliance step
#   chokes on dependabot descriptions (no ticket ref). Skip the whole job.
# - The verify job checks out the DEFAULT branch, not the PR head — the
#   script runs with GITHUB_TOKEN, and a PR could replace
#   tools/check_review_posted.py with code that exfiltrates it. python3 -I
#   only blocks stdlib shadowing.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    # Dependabot bumps are mechanical and already covered by build-and-test;
    # the AI review adds noise (and dependabot PRs lack a ticket, which the
    # ticket-compliance step chokes on). Skip the whole job for them.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: the-pr-agent/pr-agent@b249e568e0c0fb6c674ace55fe95d02f62f8f3b3   # pin a real release SHA — @latest does not resolve
        id: pr-agent
        env:
          # Cloudflare AI Gateway: routes OpenCode -> DeepSeek fallback.
          # For forkers: set your own OPENAI_KEY and OPENAI_BASE_URL.
          OPENAI_KEY: ${{ secrets.<PROJECT>_API_KEY }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/{ACCOUNT_ID}/{GATEWAY}/compat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: pr-agent-config

  verify:
    # A SEPARATE job that runs AFTER the bot job completes: GitHub does not
    # serve a job's log until it finishes, so check_review_posted.py can only
    # read the bot's failure reason from here — inside the bot's own job the
    # log endpoint returns 409 and the reason is always the generic fallback.
    needs: pr-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # read the bot's completed run log for the failure reason
    steps:
      # SECURITY: checkout the DEFAULT branch, not the PR head — the script
      # runs with GITHUB_TOKEN, and a PR could replace tools/check_review_posted.py
      # with code that exfiltrates it. python3 -I only blocks stdlib shadowing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fail loud if no review covers the head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # SECURITY: python3 -I (isolated) keeps the checkout off sys.path —
        # a repo-root json.py/urllib.py/sitecustomize.py must not shadow the
        # script's stdlib imports and run code with GITHUB_TOKEN.
        run: python3 -I tools/check_review_posted.py