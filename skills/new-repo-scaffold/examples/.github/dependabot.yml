# Dependabot — weekly for package ecosystem + github-actions.
#
# CHANGE: add more ecosystems as the repo grows; a JS/TS repo swaps the
# `pip` entry for `npm` (it reads package-lock.json). Keep the pattern:
# package manager ecosystem + github-actions, both weekly, both grouped.
#
# DO NOT CHANGE:
# - For uv projects, the package ecosystem is dependabot's `pip` ecosystem
#   (it reads uv.lock). Don't "fix" it to `uv` — that's not a valid value.
# - Weekly is the house cadence.
# - Patch/minor and major bumps are grouped per ecosystem: one PR per week
#   per class. Patch/minor auto-merge on green CI (dependabot-automerge.yml);
#   majors stay human-reviewed and never auto-merge.
# - github-actions bumps are NEVER grouped: an action ref bump is a SHA-pin
#   update per the coding standard and needs the pin treatment by a human.

version: 2
updates:
  - package-ecosystem: "pip"   # uv projects map here (uv.lock supported); JS/TS: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
